name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Reorganize Project Structure Properly
      run: |
        # إنشاء هيكل مجلدات تطبيق أندرويد القياسي
        mkdir -p app/src/main/java
        mkdir -p app/src/main/res

        # نقل ملف الواجهة Manifest إن وجد
        if [ -f "AndroidManifest.xml" ]; then
          mv AndroidManifest.xml app/src/main/
        fi

        # نقل ملفات الجافا إلى مسارها الصحيح
        for f in *.java *.kt; do
          if [ -f "$f" ]; then
            mv "$f" app/src/main/java/
          fi
        done

        # ضبط ملف الـ build.gradle الخاص بالتطبيق
        if [ -f "build.gradle" ]; then
          mv build.gradle app/
        fi

        # إنشاء ملف إعدادات المشاريع الجذرية لربط الـ app بـ gradle
        echo "include ':app'" > settings.gradle

    - name: Build Debug APK
      run: gradle :app:assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
