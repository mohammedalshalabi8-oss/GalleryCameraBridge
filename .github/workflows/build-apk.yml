name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Reorganize Project Structure Properly
      run: |
        # إنشاء هيكل مجلدات تطبيق أندرويد القياسي
        mkdir -p app/src/main/java
        mkdir -p app/src/main/res

        # نقل ملف الواجهة Manifest إن وجد
        if [ -f "AndroidManifest.xml" ]; then
          mv AndroidManifest.xml app/src/main/
        fi

        # نقل ملفات الجافا إلى مسارها الصحيح
        for f in *.java *.kt; do
          if [ -f "$f" ]; then
            mv "$f" app/src/main/java/
          fi
        done

        # ضبط ملف الـ build.gradle الخاص بالتطبيق إن وُجد
        if [ -f "build.gradle" ] && [ ! -f "app/build.gradle" ]; then
          cp build.gradle app/
        fi

        # إنشاء ملف الإعدادات الجذري مع مستودعات الإضافات المطلوبة لتجنب خطأ الإضافة
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "GalleryCameraBridge"
        include ':app'
        EOF

        # إنشاء ملف build.gradle جذري فارغ أو أساسي إن لم يكن موجوداً لربط المشروع
        if [ ! -f "build.gradle" ]; then
          echo "// Root build.gradle" > build.gradle
        fi

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.5

    - name: Build Debug APK with Wrapper
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
